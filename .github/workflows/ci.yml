name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-unit:
    name: JavaScript (engine, AI, translations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run test:unit

  php-quality:
    name: PHP 8.5 (PSR-12, static analysis, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: none
      - name: Syntax check of every PHP file
        run: |
          find src server web tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Coding standard (PSR-12)
        run: composer cs
      - name: Static analysis (PHPStan, level 8)
        run: composer stan
      - name: Unit tests (includes the replay of the JavaScript engine's recorded games)
        run: composer test

  integration:
    name: Game server (integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Start the real PHP WebSocket server and play against it
        run: npm run test:integration

  browser:
    name: Browser (desktop and emulated phone, online match against a bot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Drive headless Chrome
        run: npm run test:browser
        env:
          CHROME_BIN: google-chrome

  docker:
    name: Docker image (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t knock:ci .
      - name: Start the website and the game server with a bind-mounted data directory (as in production)
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 33:33 "$RUNNER_TEMP/data"
          docker run -d --name web -p 8080:80 -v "$RUNNER_TEMP/data:/var/www/html/data" \
            -e KNOCK_WS=wss://example.test/ws knock:ci
          docker run -d --name ws -p 8081:8081 --user 33:33 -v "$RUNNER_TEMP/data:/var/www/html/data" \
            -e WS_ALLOWED_ORIGINS=https://example.test knock:ci php /opt/knock/server.php
          for i in $(seq 1 30); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
      - name: Smoke test
        run: |
          set -eu
          B=http://localhost:8080
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code $B/)" = 200
          curl -s $B/ | grep -q 'wss:\\/\\/example.test\\/ws'
          for f in engine.js ai.js audio.js i18n.js net.js main.js; do test "$(code $B/js/$f)" = 200; done
          test "$(code $B/css/style.css)" = 200
          for f in manifest.webmanifest sw.js icons/icon-192.png; do test "$(code $B/$f)" = 200; done
          # the leaderboard API: empty at first, GET only, and it never serves the data directory
          test "$(curl -s $B/api.php)" = '[]'
          test "$(code -X DELETE $B/api.php)" = 405
          test "$(code $B/data/ratings.json)" = 403
          test "$(code $B/data/)" = 403
          # the PHP code (src/, server/, vendor/) lives outside the docroot
          for p in src/Engine/Game.php server/server.php vendor/autoload.php composer.json; do test "$(code $B/$p)" = 404; done
          # the leaderboard is written by the game server and read by the website, without any token hash
          printf '%s' '{"players":[{"name":"Alice","tokenHash":"secrethash","rating":1020,"played":1,"wins":1,"losses":0,"pf":7,"pa":3}],"pairs":{}}' \
            | sudo tee "$RUNNER_TEMP/data/ratings.json" > /dev/null
          sudo chmod 644 "$RUNNER_TEMP/data/ratings.json"
          curl -s $B/api.php | grep -q '"rating":1020'
          ! curl -s $B/api.php | grep -q secrethash
          # the game server is up, shares the data directory as www-data, and enforces its origin list
          docker logs ws | grep -q 'listening'
          ! docker logs ws | grep -q WARNING
          H='Connection: Upgrade'; U='Upgrade: websocket'; V='Sec-WebSocket-Version: 13'; K='Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ=='
          curl -s -i --max-time 3 -H "$H" -H "$U" -H "$V" -H "$K" -H 'Origin: https://example.test' http://localhost:8081/ | head -1 | grep -q 101
          curl -s -i --max-time 3 -H "$H" -H "$U" -H "$V" -H "$K" -H 'Origin: https://evil.test' http://localhost:8081/ | head -1 | grep -q 400
      - name: Container logs
        if: failure()
        run: docker logs web; docker logs ws
